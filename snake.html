<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #1a1a2e;
    font-family: 'Segoe UI', sans-serif;
    flex-direction: column;
    gap: 20px;
  }
  h1 { color: #e94560; font-size: 2rem; letter-spacing: 2px; }
  .score { color: #eee; font-size: 1.2rem; }
  .score span { color: #e94560; font-weight: bold; }
  canvas {
    border: 2px solid #e94560;
    background: #16213e;
  }
  .overlay {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #e94560;
    font-size: 2rem;
    font-weight: bold;
    pointer-events: none;
    display: none;
  }
  .controls {
    color: #888;
    font-size: 0.85rem;
    text-align: center;
    line-height: 1.6;
  }
  button {
    padding: 10px 30px;
    font-size: 1rem;
    background: #e94560;
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 1px;
  }
  button:hover { background: #c73b52; }
</style>
</head>
<body>
<h1>贪吃蛇</h1>
<div class="score">分数: <span id="score">0</span></div>
<canvas id="canvas"></canvas>
<div class="overlay" id="overlay">游戏结束</div>
<button id="restart">重新开始</button>
<div class="controls">
  方向键 / WASD 控制移动 &nbsp;|&nbsp; P 暂停
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const overlay = document.getElementById('overlay');

const gridSize = 20;
const tileCount = 20;
canvas.width = canvas.height = gridSize * tileCount;

let snake, food, dx, dy, score, gameLoop, paused, gameOver, speed;

function init() {
  snake = [
    { x: 10, y: 10 },
    { x: 9, y: 10 },
    { x: 8, y: 10 }
  ];
  dx = 1;
  dy = 0;
  score = 0;
  speed = 100;
  paused = false;
  gameOver = false;
  overlay.style.display = 'none';
  scoreEl.textContent = score;
  placeFood();
  if (gameLoop) clearInterval(gameLoop);
  gameLoop = setInterval(update, speed);
}

function placeFood() {
  while (true) {
    food = {
      x: Math.floor(Math.random() * tileCount),
      y: Math.floor(Math.random() * tileCount)
    };
    if (!snake.some(s => s.x === food.x && s.y === food.y)) break;
  }
}

function update() {
  if (paused || gameOver) return;

  const head = { x: snake[0].x + dx, y: snake[0].y + dy };

  if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
    endGame();
    return;
  }
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    endGame();
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = score;
    placeFood();
    if (speed > 40 && score % 50 === 0) {
      clearInterval(gameLoop);
      speed -= 5;
      gameLoop = setInterval(update, speed);
    }
  } else {
    snake.pop();
  }

  draw();
}

function endGame() {
  gameOver = true;
  overlay.style.display = 'block';
  clearInterval(gameLoop);
}

function draw() {
  ctx.fillStyle = '#16213e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // food
  ctx.fillStyle = '#e94560';
  ctx.shadowBlur = 10;
  ctx.shadowColor = '#e94560';
  ctx.fillRect(food.x * gridSize + 2, food.y * gridSize + 2, gridSize - 4, gridSize - 4);
  ctx.shadowBlur = 0;

  // snake
  snake.forEach((s, i) => {
    const g = i === 0 ? '#0f3460' : '#1a1a2e';
    ctx.fillStyle = i === 0 ? '#e94560' : '#533483';
    ctx.fillRect(s.x * gridSize + 1, s.y * gridSize + 1, gridSize - 2, gridSize - 2);
    if (i === 0) {
      ctx.fillStyle = '#fff';
      const ex = dx === 0 ? 3 : 0;
      const ey = dy === 0 ? 3 : 0;
      ctx.fillRect(s.x * gridSize + 6 - ex, s.y * gridSize + 6 - ey, 4, 4);
      ctx.fillRect(s.x * gridSize + 11 + ex, s.y * gridSize + 6 - ey, 4, 4);
    }
  });
}

document.addEventListener('keydown', e => {
  const key = e.key.toLowerCase();
  if (key === 'arrowup' || key === 'w')    { if (dy === 0) { dx = 0; dy = -1; } e.preventDefault(); }
  if (key === 'arrowdown' || key === 's')  { if (dy === 0) { dx = 0; dy = 1; }  e.preventDefault(); }
  if (key === 'arrowleft' || key === 'a')  { if (dx === 0) { dx = -1; dy = 0; } e.preventDefault(); }
  if (key === 'arrowright' || key === 'd') { if (dx === 0) { dx = 1; dy = 0; }  e.preventDefault(); }
  if (key === 'p') { paused = !paused; overlay.style.display = paused ? 'block' : 'none'; if (paused) overlay.textContent = '暂停中'; }
  if (key === ' ' && gameOver) { init(); }
});

document.getElementById('restart').addEventListener('click', init);

init();
</script>
</body>
</html>
